<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6a5ae6" />

    <!-- Fonts (Non-blocking high-perf swap) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Google+Sans:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@700;800;900&family=Inter:wght@600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Google+Sans:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@700;800;900&family=Inter:wght@600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Google+Sans:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@700;800;900&family=Inter:wght@600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Instrument+Serif:ital@0;1&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Synapse — AI Study Assistant</title>
    <meta
      name="description"
      content="Synapse turns your course notes and PDFs into a conversational study partner: chat with citations, generate quizzes, notes, and flashcards."
    />
    <link rel="canonical" href="https://synapse.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Synapse" />
    <meta property="og:title" content="Synapse — AI Study Assistant" />
    <meta
      property="og:description"
      content="Chat with your documents, and generate quizzes, notes, and flashcards — all with citations grounded in your files."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:url" content="https://synapse.vercel.app/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Synapse — AI Study Assistant" />
    <meta
      name="twitter:description"
      content="Chat with your documents, and generate quizzes, notes, and flashcards."
    />
    <meta name="twitter:image" content="/og-image.svg" />
    <style>
      :root {
        --font-sans: 'Figtree', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-display: 'Google Sans', 'Plus Jakarta Sans', var(--font-sans);
        --surface: #ffffff;
        --text: #37352f;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        min-height: 100%;
        background-color: var(--bg, #ffffff);
        color: var(--text, #37352f);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      #root { width: 100%; min-height: 100vh; }
      :root[data-theme="dark"] html,
      :root[data-theme="dark"] body {
        background-color: #000000;
        color: #f3f4f6;
      }
      .notion-page {
        min-height: 100svh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 20px 36px;
        background: var(--bg, #ffffff);
        color: var(--text, #37352f);
      }
      :root[data-theme="dark"] .notion-page {
        background: #000000;
        color: #f3f4f6;
      }
      .notion-content-wrap {
        width: 100%;
        max-width: 440px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0 16px;
      }
      .notion-brand-header {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
      }
      .notion-brand-name {
        font-size: 21px;
        font-weight: 700;
        color: #1a1915;
        letter-spacing: -0.025em;
        font-family: var(--font-display);
      }
      .notion-main-title {
        margin: 0 0 4px;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #000000;
        line-height: 1.2;
        font-family: var(--font-display);
      }
      .notion-sub-title {
        margin: 0 0 28px;
        font-size: 19px;
        font-weight: 400;
        color: #52525b;
        letter-spacing: -0.015em;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Apply the saved/OS theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("synapse_theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
