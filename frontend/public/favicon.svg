<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <style>
    :root {
      --emblem-stroke: #18181b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --emblem-stroke: #ffffff;
      }
    }
    .syn-emblem {
      stroke: var(--emblem-stroke);
    }
  </style>

  <!-- Scaled Synapse Atomic Orbital Emblem (Transparent adaptive background for Light & Dark mode) -->
  <g transform="translate(32,32) scale(2.2) translate(-12,-12)">
    <!-- Orbital loop 1 (rotated -45deg) -->
    <rect
      class="syn-emblem"
      x="1.5"
      y="6.75"
      width="21"
      height="10.5"
      rx="5.25"
      transform="rotate(-45 12 12)"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Orbital loop 2 (rotated +45deg) -->
    <rect
      class="syn-emblem"
      x="1.5"
      y="6.75"
      width="21"
      height="10.5"
      rx="5.25"
      transform="rotate(45 12 12)"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Central nucleus ring -->
    <circle
      class="syn-emblem"
      cx="12"
      cy="12"
      r="2.6"
      stroke-width="2.2"
      fill="none"
    />
  </g>
</svg>
