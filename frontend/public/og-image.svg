<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="SYNAPSE — AI Study Assistant">
  <!-- Deep Obsidian Black Background -->
  <rect width="1200" height="630" fill="#000000"/>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      .brand-title {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: 3px;
        fill: #ffffff;
      }
      .brand-subtitle {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        letter-spacing: -0.5px;
        fill: #9ca3af;
      }
      .brand-footer {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        letter-spacing: 0.2px;
        fill: #71717a;
      }
    </style>
  </defs>

  <!-- Brand Lockup Group -->
  <g transform="translate(140, 215)">
    <!-- Exact Scaled Atomic Orbital Logo Mark -->
    <g transform="scale(4.8)">
      <!-- Orbital loop 1 (rotated -45deg) -->
      <rect
        x="1.5"
        y="6.75"
        width="21"
        height="10.5"
        rx="5.25"
        transform="rotate(-45 12 12)"
        stroke="#ffffff"
        stroke-width="2.1"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />

      <!-- Orbital loop 2 (rotated +45deg) -->
      <rect
        x="1.5"
        y="6.75"
        width="21"
        height="10.5"
        rx="5.25"
        transform="rotate(45 12 12)"
        stroke="#ffffff"
        stroke-width="2.1"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />

      <!-- Central nucleus ring -->
      <circle
        cx="12"
        cy="12"
        r="2.8"
        stroke="#ffffff"
        stroke-width="2.1"
        fill="none"
      />
    </g>

    <!-- Capital SYNAPSE Typography -->
    <text x="145" y="78" class="brand-title" font-size="82">SYNAPSE</text>
    <text x="148" y="128" class="brand-subtitle" font-size="32">AI Study Assistant</text>
  </g>

  <!-- Footer Features Banner -->
  <text x="140" y="475" class="brand-footer" font-size="28">Chat with citations · Interactive Quizzes · Cornell Notes · 3D Flashcards</text>
</svg>
