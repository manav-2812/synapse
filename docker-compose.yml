# Local full-stack: Postgres + Synapse API + Frontend
# Usage:  docker compose up --build
#        Frontend → http://localhost:4173   API → http://localhost:8000   Postgres → localhost:5432
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse
      POSTGRES_DB: synapse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env          # gitignored — contains real secrets
    environment:
      # These override the .env values for the Docker network
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://synapse:synapse@db:5432/synapse
      CHROMA_PERSIST_PATH: /app/chroma_db
      STORAGE_PATH: /app/storage
      ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000,http://localhost:4173,http://127.0.0.1:4173
    volumes:
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "4173:4173"

volumes:
  pgdata:
